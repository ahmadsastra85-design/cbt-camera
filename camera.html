<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Kamera CBT</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f1f5f9;color:#1e293b}
  main{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0001}
  h1{font-size:1.4rem;margin-top:0}
  video{width:100%;background:#0f172a;border-radius:12px;aspect-ratio:4/3;object-fit:cover}
  #status{background:#f1f5f9;border-radius:10px;padding:12px;margin:12px 0;line-height:1.5}
  button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:10px;font-size:1rem;font-weight:650;background:#2563eb;color:white}
  button:disabled{opacity:.5}
  .ok{background:#dcfce7!important;color:#166534}
  .note{font-size:.88rem;color:#475569;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Verifikasi Wajah CBT</h1>
  <p class="note">Foto wajah akan diambil saat verifikasi dan disimpan untuk pengawasan ujian. Lanjutkan hanya setelah membaca pemberitahuan madrasah. Halaman ini harus dibuka melalui HTTPS.</p>
  <video id="video" autoplay muted playsinline></video>
  <div id="status" role="status" aria-live="polite">Tekan Aktifkan Kamera untuk memulai.</div>
  <button id="start">Aktifkan Kamera</button>
  <button id="verify" disabled>Verifikasi dan Kembali ke Ujian</button>
</main>
<script type="module">
import { FaceDetector, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const statusBox = document.getElementById('status');
const startBtn = document.getElementById('start');
const verifyBtn = document.getElementById('verify');
let stream = null;
let detector = null;

function status(message, ok=false) {
  statusBox.textContent = message;
  statusBox.className = ok ? 'ok' : '';
}
function sendResult(success, message, photoDataUrl=null) {
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      type:'CBT_FACE_RESULT', success, message, photoDataUrl
    }, '*');
  }
}
function captureFacePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error('Kamera belum siap mengambil foto.');
  }
  const maxWidth = 640;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const context = canvas.getContext('2d', {alpha:false});
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.72);
}

async function stopCamera() {
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
}
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    if (!window.isSecureContext) throw new Error('Halaman kamera harus menggunakan HTTPS.');
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Browser tidak menyediakan akses kamera. Buka halaman ini langsung di Chrome terbaru.');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}}
    });
    video.srcObject = stream;
    await video.play();
    status('Kamera aktif. Memuat model deteksi wajah...');
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      minDetectionConfidence:0.6
    });
    status('Kamera siap. Pastikan hanya wajah peserta ujian yang terlihat, lalu tekan Verifikasi.');
    verifyBtn.disabled = false;
  } catch (e) {
    await stopCamera();
    startBtn.disabled = false;
    const name = e?.name || '';
    let msg = e?.message || String(e);
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      msg = 'Izin kamera ditolak. Izinkan kamera untuk halaman hosting ini di Chrome dan Setelan Android, lalu muat ulang halaman.';
    } else if (name === 'NotFoundError') {
      msg = 'Kamera tidak ditemukan pada perangkat.';
    } else if (name === 'NotReadableError') {
      msg = 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain dan coba lagi.';
    }
    status('Kamera gagal diaktifkan: ' + msg);
  }
});

verifyBtn.addEventListener('click', async () => {
  verifyBtn.disabled = true;
  try {
    if (!detector || !stream || video.readyState < 2) {
      throw new Error('Aktifkan kamera terlebih dahulu.');
    }
    const result = detector.detectForVideo(video, performance.now());
    const detections = result.detections || [];
    if (detections.length === 0) {
      status('Wajah belum terdeteksi. Perbaiki pencahayaan dan posisi wajah, lalu coba lagi.');
      verifyBtn.disabled = false;
      return;
    }
    if (detections.length > 1) {
      status('Terdeteksi lebih dari satu wajah. Pastikan hanya satu peserta terlihat.');
      verifyBtn.disabled = false;
      return;
    }
    status('Wajah terdeteksi. Mengambil foto dan mengirim ke CBT...', true);
    const photoDataUrl = captureFacePhoto();
    sendResult(true, 'Verifikasi wajah berhasil.', photoDataUrl);
    await stopCamera();
    setTimeout(() => window.close(), 500);
  } catch (e) {
    status('Verifikasi gagal: ' + (e?.message || String(e)));
    verifyBtn.disabled = false;
    sendResult(false, 'Verifikasi wajah gagal.');
  }
});
window.addEventListener('beforeunload', stopCamera);
</script>
</body>
</html>
