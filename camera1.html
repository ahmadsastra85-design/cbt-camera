<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Kamera CBT</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f1f5f9;color:#1e293b}
  main{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0001}
  h1{font-size:1.4rem;margin-top:0}
  video{width:100%;background:#0f172a;border-radius:12px;aspect-ratio:4/3;object-fit:cover}
  #status,#objectStatus{background:#f1f5f9;border-radius:10px;padding:12px;margin:12px 0;line-height:1.5}
  #objectStatus{border-left:4px solid #94a3b8;font-size:.92rem}
  #objectStatus.detected{background:#fef3c7;border-left-color:#d97706;color:#92400e}
  button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:10px;font-size:1rem;font-weight:650;background:#2563eb;color:white}
  button:disabled{opacity:.5}
  .ok{background:#dcfce7!important;color:#166534}
  .note{font-size:.88rem;color:#475569;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Verifikasi Wajah CBT</h1>
  <p class="note">Foto wajah akan diambil saat verifikasi dan disimpan untuk pengawasan ujian. Lanjutkan hanya setelah membaca pemberitahuan madrasah. Halaman ini harus dibuka melalui HTTPS.</p>
  <video id="video" autoplay muted playsinline></video>
  <div id="status" role="status" aria-live="polite">Tekan Aktifkan Kamera untuk memulai.</div>
  <div id="objectStatus" role="status" aria-live="polite">Deteksi objek HP belum aktif.</div>
  <button id="start">Aktifkan Kamera</button>
  <button id="verify" disabled>Verifikasi dan Kembali ke Ujian</button>
</main>
<script type="module">
import { FaceDetector, ObjectDetector, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const statusBox = document.getElementById('status');
const startBtn = document.getElementById('start');
const verifyBtn = document.getElementById('verify');
const objectStatusBox = document.getElementById('objectStatus');
let stream = null;
let detector = null;
let objectDetector = null;
let objectDetectionTimer = null;
let lastObjectDetectionAt = 0;
let consecutivePhoneFrames = 0;
let phoneWasVisible = false;
let parentOrigin = null;
let verificationCompleted = false;
let monitoringEnabled = false;
let phoneEventCount = 0;
let phoneAbsentFrames = 0;
let phoneEventPending = false;
let pendingPhoneEventId = null;
let phoneRearmed = true;
const PHONE_ABSENT_FRAMES_TO_RESET = 4;
const CAMERA_ORIGIN = window.location.origin;
const OBJECT_DETECTION_INTERVAL_MS = 500;
const PHONE_CONFIDENCE_THRESHOLD = 0.80;
const PHONE_REQUIRED_CONSECUTIVE_FRAMES = 3;

function status(message, ok=false) {
  statusBox.textContent = message;
  statusBox.className = ok ? 'ok' : '';
}
function setObjectStatus(message, detected=false) {
  objectStatusBox.textContent = message;
  objectStatusBox.classList.toggle('detected', detected);
}
function startObjectDetection(initialEventCount=0) {
  if (objectDetectionTimer) clearInterval(objectDetectionTimer);
  lastObjectDetectionAt = 0;
  consecutivePhoneFrames = 0;
  phoneAbsentFrames = 0;
  phoneEventPending = false;
  phoneRearmed = true;
  phoneEventCount = Math.max(0, Math.min(2, Number(initialEventCount) || 0));
  monitoringEnabled = phoneEventCount < 2;
  setObjectStatus('Pemantauan HP aktif. Gambar diproses sementara di perangkat; tidak ada video yang direkam atau disimpan.');
  objectDetectionTimer = setInterval(() => {
    if (!monitoringEnabled || !objectDetector || !stream || video.readyState < 2) return;
    const now = performance.now();
    if (now - lastObjectDetectionAt < OBJECT_DETECTION_INTERVAL_MS) return;
    lastObjectDetectionAt = now;
    try {
      const result = objectDetector.detectForVideo(video, now);
      const detections = result.detections || [];
      const phone = detections.find(item =>
        String(item.categories?.[0]?.categoryName || '').toLowerCase() === 'cell phone' &&
        Number(item.categories?.[0]?.score || 0) >= PHONE_CONFIDENCE_THRESHOLD
      );
      if (phone) {
        phoneAbsentFrames = 0;
        consecutivePhoneFrames += 1;
        const confidence = Math.round(Number(phone.categories[0].score) * 100);
        if (consecutivePhoneFrames >= PHONE_REQUIRED_CONSECUTIVE_FRAMES) {
          if (phoneEventCount < 2 && !phoneEventPending && phoneRearmed) {
            phoneEventCount += 1;
            phoneEventPending = true;
            phoneRearmed = false;
            monitoringEnabled = phoneEventCount < 2;
            let photoDataUrl = null;
            try {
              if (phoneEventCount === 1) photoDataUrl = captureFacePhoto();
            } catch (captureError) {
              setObjectStatus('HP terdeteksi, tetapi foto bukti gagal diambil: ' + (captureError?.message || String(captureError)), true);
            }
            if (!pendingPhoneEventId) {
              pendingPhoneEventId = (window.crypto && typeof window.crypto.randomUUID === 'function')
                ? window.crypto.randomUUID().replace(/-/g, '')
                : 'HP' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
            }
            const sent = sendToParent({
              type:'CBT_PHONE_EVENT',
              eventId:pendingPhoneEventId,
              eventNumber:phoneEventCount,
              confidence,
              photoDataUrl
            });
            setObjectStatus(phoneEventCount === 1
              ? 'HP terdeteksi. Foto bukti dan peringatan pertama sedang diproses.'
              : 'HP terdeteksi kembali. Peringatan kedua dan pengiriman jawaban sedang diproses.', true);
            if (!sent) {
              phoneEventPending = false;
              setObjectStatus('HP terdeteksi, tetapi halaman SIMAEXAM tidak menerima pesan. Hubungi pengawas.', true);
            }
          } else {
            setObjectStatus('Objek HP masih terlihat. Sistem menunggu objek tidak terlihat sebelum menghitung kejadian berikutnya.', true);
          }
        } else {
          setObjectStatus('Objek menyerupai HP terdeteksi. Memvalidasi (' + consecutivePhoneFrames + '/' + PHONE_REQUIRED_CONSECUTIVE_FRAMES + ').', true);
        }
      } else {
        consecutivePhoneFrames = 0;
        phoneAbsentFrames += 1;
        if (phoneAbsentFrames >= PHONE_ABSENT_FRAMES_TO_RESET && !phoneEventPending && phoneEventCount < 2) {
          phoneRearmed = true;
          setObjectStatus('Tidak ada HP yang terdeteksi. Pemantauan berlanjut.', false);
        } else if (phoneEventPending) {
          setObjectStatus('Menunggu konfirmasi penyimpanan/peringatan dari SIMAEXAM.', true);
        } else if (phoneEventCount >= 2) {
          monitoringEnabled = false;
          setObjectStatus('Kejadian kedua telah tercatat. Pemantauan HP dihentikan sambil menunggu pengiriman jawaban.', true);
        }
      }
    } catch (error) {
      setObjectStatus('Deteksi objek mengalami kendala: ' + (error?.message || String(error)));
    }
  }, OBJECT_DETECTION_INTERVAL_MS);
}
function stopObjectDetection() {
  monitoringEnabled = false;
  if (objectDetectionTimer) clearInterval(objectDetectionTimer);
  objectDetectionTimer = null;
  objectDetector = null;
  consecutivePhoneFrames = 0;
  phoneWasVisible = false;
}
function sendToParent(payload) {
  if (!parentOrigin || !window.opener || window.opener.closed) return false;
  window.opener.postMessage(payload, parentOrigin);
  return true;
}
function sendResult(success, message, photoDataUrl=null) {
  return sendToParent({
    type:'CBT_FACE_RESULT', success, message, photoDataUrl
  });
}
window.addEventListener('message', async (event) => {
  if (!window.opener || event.source !== window.opener) return;
  const data = event.data || {};
  if (data.type === 'CBT_PARENT_PING') {
    if (event.origin !== 'null' && !event.origin.startsWith('https://')) return;
    parentOrigin = event.origin;
    sendToParent({ type:'CBT_CAMERA_READY' });
    return;
  }
  if (!parentOrigin || event.origin !== parentOrigin) return;
  if (data.type === 'CBT_START_MONITORING') {
    if (!verificationCompleted || !objectDetector || !stream) return;
    startObjectDetection(data.phoneEventCount);
    status('Ujian berlangsung. Kamera memantau objek HP.', true);
    sendToParent({ type:'CBT_MONITORING_STARTED' });
    return;
  }
  if (data.type === 'CBT_PHONE_EVENT_ACK') {
    phoneEventPending = false;
    if (data.success === false) {
      // Server belum mencatat kejadian: izinkan deteksi yang sama dicoba kembali.
      phoneEventCount = Math.max(0, phoneEventCount - 1);
      phoneRearmed = true;
      consecutivePhoneFrames = 0;
      phoneAbsentFrames = 0;
      monitoringEnabled = phoneEventCount < 2;
      setObjectStatus('Pencatatan pelanggaran gagal. Sistem akan mencoba kembali setelah objek tidak terlihat.', true);
    } else if (Number.isFinite(Number(data.occurrence))) {
      pendingPhoneEventId = null;
      phoneEventCount = Math.max(phoneEventCount, Math.min(2, Number(data.occurrence)));
      monitoringEnabled = phoneEventCount < 2;
      setObjectStatus(phoneEventCount >= 2
        ? 'Pelanggaran kedua tercatat. Pemantauan HP dihentikan.'
        : 'Pelanggaran pertama tercatat. Pemantauan berlanjut.', true);
    }
    return;
  }
  if (data.type === 'CBT_STOP_MONITORING') {
    await stopCamera();
    status('Ujian selesai. Kamera telah dihentikan.', true);
    setObjectStatus('Pemantauan kamera telah berakhir. Tidak ada video yang direkam.');
    sendToParent({ type:'CBT_CAMERA_STOPPED' });
    setTimeout(() => window.close(), 300);
  }
});
function captureFacePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error('Kamera belum siap mengambil foto.');
  }
  const maxWidth = 640;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const context = canvas.getContext('2d', {alpha:false});
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.72);
}

async function stopCamera() {
  stopObjectDetection();
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
}
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    if (!window.isSecureContext) throw new Error('Halaman kamera harus menggunakan HTTPS.');
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Browser tidak menyediakan akses kamera. Buka halaman ini langsung di Chrome terbaru.');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}}
    });
    video.srcObject = stream;
    await video.play();
    status('Kamera aktif. Memuat model deteksi wajah...');
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      minDetectionConfidence:0.6
    });
    status('Model wajah siap. Memuat model deteksi objek HP...');
    objectDetector = await ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite',
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      maxResults:10,
      scoreThreshold:PHONE_CONFIDENCE_THRESHOLD
    });
    status('Kamera dan model siap. Pastikan hanya wajah peserta ujian yang terlihat, lalu tekan Verifikasi. Pemantauan ujian dimulai setelah verifikasi berhasil.');
    verifyBtn.disabled = false;
  } catch (e) {
    await stopCamera();
    setObjectStatus('Deteksi objek belum aktif karena model gagal dimuat atau kamera tidak tersedia.');
    startBtn.disabled = false;
    const name = e?.name || '';
    let msg = e?.message || String(e);
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      msg = 'Izin kamera ditolak. Izinkan kamera untuk halaman hosting ini di Chrome dan Setelan Android, lalu muat ulang halaman.';
    } else if (name === 'NotFoundError') {
      msg = 'Kamera tidak ditemukan pada perangkat.';
    } else if (name === 'NotReadableError') {
      msg = 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain dan coba lagi.';
    }
    status('Kamera gagal diaktifkan: ' + msg);
  }
});

verifyBtn.addEventListener('click', async () => {
  verifyBtn.disabled = true;
  try {
    if (!detector || !stream || video.readyState < 2) {
      throw new Error('Aktifkan kamera terlebih dahulu.');
    }
    const result = detector.detectForVideo(video, performance.now());
    const detections = result.detections || [];
    if (detections.length === 0) {
      status('Wajah belum terdeteksi. Perbaiki pencahayaan dan posisi wajah, lalu coba lagi.');
      verifyBtn.disabled = false;
      return;
    }
    if (detections.length > 1) {
      status('Terdeteksi lebih dari satu wajah. Pastikan hanya satu peserta terlihat.');
      verifyBtn.disabled = false;
      return;
    }
    if (!parentOrigin) {
      throw new Error('Koneksi dengan halaman SIMAEXAM belum siap. Muat ulang halaman ujian dan coba kembali.');
    }
    status('Wajah terdeteksi. Mengambil foto verifikasi...', true);
    const photoDataUrl = captureFacePhoto();
    const sent = sendResult(true, 'Verifikasi wajah berhasil.', photoDataUrl);
    if (!sent) throw new Error('Hasil verifikasi tidak dapat dikirim ke SIMAEXAM.');
    verificationCompleted = true;
    startBtn.disabled = true;
    verifyBtn.disabled = true;
    status('Verifikasi berhasil. Menunggu konfirmasi SIMAEXAM untuk memulai pemantauan ujian.', true);
    setObjectStatus('Verifikasi berhasil. Deteksi HP dimulai setelah ujian resmi dimulai.');
  } catch (e) {
    status('Verifikasi gagal: ' + (e?.message || String(e)));
    verifyBtn.disabled = false;
    sendResult(false, 'Verifikasi wajah gagal.');
  }
});
window.addEventListener('beforeunload', () => {
  stopCamera();
  sendToParent({ type:'CBT_CAMERA_STOPPED' });
});
</script>
</body>
</html>
