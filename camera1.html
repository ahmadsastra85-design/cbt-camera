<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kamera AI SIMAEXAM</title>
<meta name="simaexam-camera-build" content="20261113-r2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;max-width:100%;max-height:100%;overflow:hidden!important;overscroll-behavior:none;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
  body{position:fixed;inset:0}
  main{width:100%;height:100%;min-height:0;max-height:100%;padding:10px;display:flex;flex-direction:column;gap:8px;background:#0f172a;overflow:hidden}
  h1{font-size:1rem;margin:0}
  .note{font-size:.75rem;color:#cbd5e1;line-height:1.35;margin:0}
  .video-wrap{position:relative;flex:1;min-height:100px;overflow:hidden;border-radius:10px;background:#020617}
  video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #status,#objectStatus{background:#1e293b;border-radius:8px;padding:8px;margin:0;font-size:.76rem;line-height:1.35}
  #objectStatus{border-left:3px solid #64748b}
  #objectStatus.detected{background:#713f12;border-left-color:#f59e0b;color:#fef3c7}
  .ok{background:#14532d!important;color:#dcfce7}
  .compact main{padding:0;gap:0}
  .compact h1,.compact .note,.compact #status{display:none}
  .compact .video-wrap{height:100%;min-height:0;border-radius:0}
  .compact #objectStatus{position:absolute;left:5px;right:5px;bottom:5px;padding:5px 7px;font-size:10px;opacity:.94}
</style>
</head>
<body>
<main>
  <h1>Kamera AI SIMAEXAM</h1>
  <p class="note">Kamera digunakan untuk verifikasi wajah dan pemantauan objek selama ujian. Video diproses di perangkat dan tidak direkam.</p>
  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
  </div>
  <div id="status" role="status" aria-live="polite">Menunggu koneksi dengan SIMAEXAM.</div>
  <div id="objectStatus" role="status" aria-live="polite">Deteksi objek HP belum aktif.</div>
</main>
<script type="module">
import { FaceDetector, ObjectDetector, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = document.getElementById('video');
const statusBox = document.getElementById('status');
const objectStatusBox = document.getElementById('objectStatus');
let stream = null;
let detector = null;
let objectDetector = null;
let objectDetectionTimer = null;
let lastObjectDetectionAt = 0;
let consecutivePhoneFrames = 0;
let parentOrigin = null;
let verificationCompleted = false;
let monitoringEnabled = false;
let phoneEventCount = 0;
let phoneAbsentFrames = 0;
let phoneEventPending = false;
let phoneRearmed = true;
let cameraStarting = false;
const PHONE_ABSENT_FRAMES_TO_RESET = 4;
const OBJECT_DETECTION_INTERVAL_MS = 500;
const PHONE_CONFIDENCE_THRESHOLD = 0.80;
const PHONE_REQUIRED_CONSECUTIVE_FRAMES = 3;

function status(message, ok=false) {
  statusBox.textContent = message;
  statusBox.className = ok ? 'ok' : '';
}
function setObjectStatus(message, detected=false) {
  objectStatusBox.textContent = message;
  objectStatusBox.classList.toggle('detected', detected);
}
function sendToParent(payload) {
  if (!parentOrigin) return false;
  const target = window.parent !== window ? window.parent : window.opener;
  if (!target || (target === window.opener && target.closed)) return false;
  target.postMessage(payload, parentOrigin);
  return true;
}
function captureFacePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error('Kamera belum siap mengambil foto.');
  }
  const maxWidth = 640;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const context = canvas.getContext('2d', {alpha:false});
  context.translate(canvas.width, 0);
  context.scale(-1, 1);
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.72);
}
function startObjectDetection(initialEventCount=0) {
  if (objectDetectionTimer) clearInterval(objectDetectionTimer);
  lastObjectDetectionAt = 0;
  consecutivePhoneFrames = 0;
  phoneAbsentFrames = 0;
  phoneEventPending = false;
  phoneEventCount = Math.max(0, Math.min(2, Number(initialEventCount) || 0));
  phoneRearmed = true;
  monitoringEnabled = phoneEventCount < 2;
  setObjectStatus(monitoringEnabled
    ? 'Pemantauan HP aktif. Video diproses sementara di perangkat.'
    : 'Batas dua kejadian telah tercapai. Pemantauan dihentikan.');
  if (!monitoringEnabled) return;

  objectDetectionTimer = setInterval(() => {
    if (!monitoringEnabled || !objectDetector || !stream || video.readyState < 2) return;
    const now = performance.now();
    if (now - lastObjectDetectionAt < OBJECT_DETECTION_INTERVAL_MS) return;
    lastObjectDetectionAt = now;
    try {
      const result = objectDetector.detectForVideo(video, now);
      const detections = result.detections || [];
      const phone = detections.find(item =>
        String(item.categories?.[0]?.categoryName || '').toLowerCase() === 'cell phone' &&
        Number(item.categories?.[0]?.score || 0) >= PHONE_CONFIDENCE_THRESHOLD
      );
      if (phone) {
        phoneAbsentFrames = 0;
        consecutivePhoneFrames += 1;
        const confidence = Math.round(Number(phone.categories[0].score) * 100);
        if (consecutivePhoneFrames >= PHONE_REQUIRED_CONSECUTIVE_FRAMES) {
          if (phoneEventCount < 2 && !phoneEventPending && phoneRearmed) {
            phoneEventCount += 1;
            phoneEventPending = true;
            phoneRearmed = false;
            monitoringEnabled = phoneEventCount < 2;
            let photoDataUrl = null;
            try {
              if (phoneEventCount === 1) photoDataUrl = captureFacePhoto();
            } catch (captureError) {
              setObjectStatus('HP terdeteksi, tetapi foto bukti gagal diambil: ' + (captureError?.message || String(captureError)), true);
            }
            const eventId = (window.crypto && crypto.randomUUID)
              ? crypto.randomUUID().replace(/-/g, '')
              : ('evt_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 12));
            const sent = sendToParent({
              type:'CBT_PHONE_EVENT', eventId,
              eventNumber:phoneEventCount, confidence, photoDataUrl
            });
            setObjectStatus(phoneEventCount === 1
              ? 'HP terdeteksi. Foto bukti dan peringatan pertama sedang diproses.'
              : 'HP terdeteksi kembali. Peringatan kedua sedang diproses.', true);
            if (!sent) {
              phoneEventPending = false;
              setObjectStatus('Halaman SIMAEXAM tidak menerima pesan deteksi. Hubungi pengawas.', true);
            }
          } else {
            setObjectStatus('Objek HP masih terlihat. Menunggu objek tidak terlihat sebelum menghitung kejadian berikutnya.', true);
          }
        } else {
          setObjectStatus('Objek menyerupai HP terdeteksi. Memvalidasi (' +
            consecutivePhoneFrames + '/' + PHONE_REQUIRED_CONSECUTIVE_FRAMES + ').', true);
        }
      } else {
        consecutivePhoneFrames = 0;
        phoneAbsentFrames += 1;
        if (phoneAbsentFrames >= PHONE_ABSENT_FRAMES_TO_RESET &&
            !phoneEventPending && phoneEventCount < 2) {
          phoneRearmed = true;
          setObjectStatus('Tidak ada HP yang terdeteksi. Pemantauan berlanjut.');
        } else if (phoneEventPending) {
          setObjectStatus('Menunggu konfirmasi pencatatan dari SIMAEXAM.', true);
        }
      }
    } catch (error) {
      setObjectStatus('Deteksi objek mengalami kendala: ' + (error?.message || String(error)));
    }
  }, OBJECT_DETECTION_INTERVAL_MS);
}
function stopObjectDetection() {
  monitoringEnabled = false;
  if (objectDetectionTimer) clearInterval(objectDetectionTimer);
  objectDetectionTimer = null;
  consecutivePhoneFrames = 0;
}
async function stopCamera() {
  stopObjectDetection();
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
  detector = null;
  objectDetector = null;
  verificationCompleted = false;
  cameraStarting = false;
}
async function activateCamera() {
  if (cameraStarting || stream) return;
  cameraStarting = true;
  try {
    if (!window.isSecureContext) throw new Error('Halaman kamera harus menggunakan HTTPS.');
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Browser tidak menyediakan akses kamera.');
    }
    const cameraStream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}}
    });
    stream = cameraStream;
    video.srcObject = stream;
    await video.play();
    status('Kamera aktif. Memuat model deteksi wajah...');
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      minDetectionConfidence:0.6
    });
    status('Model wajah siap. Memuat model deteksi objek HP...');
    objectDetector = await ObjectDetector.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite',
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      maxResults:10,
      scoreThreshold:PHONE_CONFIDENCE_THRESHOLD
    });
    status('Kamera dan model AI siap. Posisikan wajah, lalu tekan Verifikasi dan Mulai Ujian.', true);
    sendToParent({type:'CBT_CAMERA_STARTED'});
  } catch (error) {
    await stopCamera();
    const name = error?.name || '';
    let message = error?.message || String(error);
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      message = 'Browser menolak izin kamera pada halaman ini. Periksa ikon kamera di bilah alamat dan izinkan akses. Jika halaman ini berada di dalam iframe, gunakan tombol Kamera Mandiri di SIMAEXAM agar kamera dibuka langsung pada tab/jendela HTTPS.';
    } else if (name === 'NotFoundError') {
      message = 'Kamera tidak ditemukan pada perangkat.';
    } else if (name === 'NotReadableError') {
      message = 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain dan coba kembali.';
    }
    status('Kamera gagal diaktifkan: ' + message);
    sendToParent({type:'CBT_CAMERA_ERROR', message});
  } finally {
    cameraStarting = false;
  }
}
async function verifyFace() {
  try {
    if (!detector || !stream || video.readyState < 2) {
      throw new Error('Aktifkan kamera terlebih dahulu.');
    }
    const result = detector.detectForVideo(video, performance.now());
    const detections = result.detections || [];
    if (detections.length === 0) {
      throw new Error('Wajah belum terdeteksi. Perbaiki pencahayaan dan posisi wajah.');
    }
    if (detections.length > 1) {
      throw new Error('Terdeteksi lebih dari satu wajah. Pastikan hanya satu peserta terlihat.');
    }
    status('Wajah terdeteksi. Mengambil foto verifikasi...', true);
    const photoDataUrl = captureFacePhoto();
    verificationCompleted = true;
    sendToParent({type:'CBT_FACE_RESULT', success:true,
      message:'Verifikasi wajah berhasil.', photoDataUrl});
    status('Verifikasi berhasil. Menunggu konfirmasi SIMAEXAM untuk memulai ujian.', true);
  } catch (error) {
    status('Verifikasi gagal: ' + (error?.message || String(error)));
    sendToParent({type:'CBT_FACE_RESULT', success:false,
      message:error?.message || 'Verifikasi wajah gagal.'});
  }
}

window.addEventListener('message', async event => {
  const parentWindow = window.parent !== window ? window.parent : window.opener;
  if (!parentWindow || event.source !== parentWindow) return;
  const data = event.data || {};

  if (data.type === 'CBT_PARENT_PING') {
    if (event.origin === 'null' || !event.origin.startsWith('https://')) return;
    parentOrigin = event.origin;
    sendToParent({type:'CBT_CAMERA_READY'});
    return;
  }
  if (!parentOrigin || event.origin !== parentOrigin) return;

  if (data.type === 'CBT_START_CAMERA') {
    await activateCamera();
    return;
  }
  if (data.type === 'CBT_VERIFY_FACE') {
    await verifyFace();
    return;
  }
  if (data.type === 'CBT_SET_COMPACT') {
    document.body.classList.toggle('compact', data.compact === true);
    return;
  }
  if (data.type === 'CBT_START_MONITORING') {
    if (!verificationCompleted || !objectDetector || !stream) return;
    startObjectDetection(data.phoneEventCount || 0);
    status('Ujian berlangsung. Kamera memantau objek HP.', true);
    sendToParent({type:'CBT_MONITORING_STARTED'});
    return;
  }
  if (data.type === 'CBT_PHONE_EVENT_ACK') {
    phoneEventPending = false;
    if (data.success === false) {
      phoneEventCount = Math.max(0, phoneEventCount - 1);
      phoneRearmed = true;
      phoneAbsentFrames = PHONE_ABSENT_FRAMES_TO_RESET;
      monitoringEnabled = true;
      setObjectStatus('Kejadian belum tercatat di server. Pemantauan akan mencoba kembali.', true);
    } else {
      if ([1,2].includes(Number(data.occurrence))) {
        phoneEventCount = Number(data.occurrence);
      }
      if (phoneEventCount >= 2) {
        monitoringEnabled = false;
        setObjectStatus('Kejadian kedua tercatat. Jawaban ujian sedang dikirim otomatis.', true);
      } else {
        setObjectStatus('Peringatan pertama tercatat. Pemantauan berlanjut.', true);
      }
    }
    return;
  }
  if (data.type === 'CBT_STOP_MONITORING') {
    await stopCamera();
    status('Ujian selesai. Kamera telah dihentikan.', true);
    setObjectStatus('Pemantauan kamera telah berakhir. Tidak ada video yang direkam.');
    sendToParent({type:'CBT_CAMERA_STOPPED'});
  }
});

window.addEventListener('beforeunload', stopCamera);
</script>
</body>
</html>
